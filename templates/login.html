<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>
    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
>
</head>

<body>

    <header class="login-header">

    <div class="pib-brand">

        <div class="pib-logo-mark">
            PIB
        </div>

        <div>

            <h1>Palestine Investment Bank</h1>

            <p>بنك الاستثمار الفلسطيني</p>

        </div>

    </div>

</header>

<main class="login-container">

    <div class="login-card">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form
        action="{{ url_for('login_page') }}"
        method="POST"
    >
        <label for="username">Username</label>

        <input
            type="text"
            id="username"
            name="username"
            required
        >

        <br><br>

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <br><br>

        <button type="submit">
            Login
        </button>
    </form>

<p>
        Don’t have an account?
        <a href="{{ url_for('create_account_page') }}">
            Create Account
        </a>
</p>

</div>
</main>
</body>
</html>
